[project]
name = "mcp-to-cli-kit"
version = "0.1.0"
description = "Build a typed command-line interface for one or more remote MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Filip Procházka" }]
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_to_cli_kit"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.14",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
