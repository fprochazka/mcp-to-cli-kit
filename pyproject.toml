[project]
name = "mcp-to-cli-kit"
dynamic = ["version"]
description = "Build a typed command-line interface for one or more remote MCP servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Filip Procházka", email = "dev@fprochazka.cz" }]
keywords = ["mcp", "model-context-protocol", "cli", "click", "json-schema", "ai-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: User Interfaces",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "click>=8.1,<9",
  "httpx>=0.27,<1",
  "jsonschema>=4.20,<5",
  "mcp>=1.26,<2",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/fprochazka/mcp-to-cli-kit"
Repository = "https://github.com/fprochazka/mcp-to-cli-kit"
Issues = "https://github.com/fprochazka/mcp-to-cli-kit/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_to_cli_kit"]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.0",
  "ruff>=0.14",
  "types-jsonschema>=4.20",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
